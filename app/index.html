<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vice Cover Studio</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<main class="app">
  <section class="controls">
    <h1>Vice Cover Studio</h1>
    <p class="tagline">Turn a photo and a caption into GTA 6-style multi-panel cover art, in the Vice City neon-sunset look. Everything runs offline in your browser.</p>

    <div class="group">
      <span class="label">Layout</span>
      <div class="row">
        <button type="button" data-layout="trio" class="active">Trio</button>
        <button type="button" data-layout="duo">Duo</button>
        <button type="button" data-layout="single">Single</button>
        <button type="button" data-layout="grid">Grid 2&times;2</button>
      </div>
    </div>

    <div class="group">
      <span class="label">Backdrop grade</span>
      <div class="row">
        <button type="button" data-grade="sunset" class="active">Sunset</button>
        <button type="button" data-grade="midnight">Midnight</button>
        <button type="button" data-grade="ink">Ink</button>
      </div>
    </div>

    <div class="group">
      <span class="label" id="slot-label">Panel 1 — pier</span>
      <div class="row">
        <button type="button" data-slot-kind="boulevard">Boulevard</button>
        <button type="button" data-slot-kind="pier">Pier</button>
        <button type="button" data-slot-kind="procedural">Sunset art</button>
      </div>
      <label class="upload">Upload your own photo
        <input id="upload" type="file" accept="image/*">
      </label>
      <p class="hint">Click a panel on the cover to select it, then drag it to pan the photo.</p>
    </div>

    <div class="group sliders">
      <label>Zoom <input id="zoom" type="range" min="1" max="2.5" step="0.05" value="1"></label>
      <label>Shift X <input id="shiftx" type="range" min="-5" max="5" step="0.1" value="0"></label>
      <label>Shift Y <input id="shifty" type="range" min="-5" max="5" step="0.1" value="0"></label>
    </div>

    <div class="group">
      <label>Caption <input id="caption" type="text" maxlength="40" value="Sunset Heist"></label>
      <label>Subtitle <input id="subtitle" type="text" maxlength="40" value="Vice City Nights"></label>
    </div>

    <div class="group">
      <span class="label">Export PNG</span>
      <div class="row">
        <button type="button" data-export="1080x1080">1080&times;1080</button>
        <button type="button" data-export="1080x1350">1080&times;1350</button>
        <button type="button" data-export="1920x1080">1920&times;1080</button>
      </div>
    </div>

    <div class="row">
      <button id="undo" type="button" disabled>Undo</button>
      <button id="redo" type="button" disabled>Redo</button>
    </div>
    <p id="status" role="status"></p>
  </section>
  <canvas id="cover" width="1080" height="1080" aria-label="The cover"></canvas>
</main>
<script type="module" src="./src/main.js"></script>
</body>
</html>
